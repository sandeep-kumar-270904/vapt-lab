version: '3.8'

services:
  db:
    image: postgres:15
    container_name: vapt_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-markethub_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vapt_network

volumes:
  postgres_data:

networks:
  vapt_network:
    driver: bridge
